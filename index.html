<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<link rel="stylesheet" href="//at.alicdn.com/t/c/font_5203492_oy1bwa2mp4m.css" />
		<!-- common图标 -->
		<link rel="stylesheet" href="//at.alicdn.com/t/c/font_5239074_l9976p40gb7.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>XToolKit</title>
		<!-- 深色主题：在 JS 包加载前先把 data-theme 打上，避免启动时白屏一闪 -->
		<style>
			html[data-theme='dark'] {
				background: #141414;
			}
		</style>
		<script>
			try {
				var theme = localStorage.getItem('xtools-theme') === 'dark' ? 'dark' : 'light'
				document.documentElement.dataset.theme = theme
				document.documentElement.style.colorScheme = theme
			} catch (e) {
				/* 忽略 */
			}
		</script>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
