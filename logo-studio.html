<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo 拼装台 · XToolKit</title>
<style>
  :root{
    --bg:#f6f6f7; --panel:#ffffff; --line:#e6e6e8; --text:#262626; --muted:#8a8a8f;
    --accent:#2f6fed; --accent-soft:#eaf1ff; --paper:#f3ead3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    flex:none; height:48px; display:flex; align-items:center; gap:12px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header b{font-size:14px;font-weight:600}
  header span.hint{color:var(--muted);font-size:12px}
  main{flex:1; display:flex; min-height:0}
  #stage{
    flex:1; min-width:0; display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative;
  }
  #cv{
    background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.08); border-radius:2px;
    max-width:100%; max-height:100%; touch-action:none; cursor:grab;
  }
  #cv.dragging{cursor:grabbing}
  aside{
    flex:none; width:288px; background:var(--panel); border-left:1px solid var(--line);
    padding:14px; overflow:auto; display:flex; flex-direction:column; gap:14px;
  }
  .group{display:flex;flex-direction:column;gap:8px}
  .group>label.t{font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .tabs{display:flex;gap:6px}
  .tabs button{
    flex:1; padding:7px 0; border:1px solid var(--line); background:#fff; color:var(--text);
    border-radius:7px; cursor:pointer; font-size:12.5px;
  }
  .tabs button.on{background:var(--accent-soft); border-color:#bcd2ff; color:#1b4fc4; font-weight:600}
  .row{display:flex;align-items:center;gap:8px}
  .row>span.k{width:42px;color:var(--muted);font-size:12px;flex:none}
  input[type=number]{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
    font:12px/1.2 inherit; color:var(--text); background:#fff;
  }
  input[type=range]{width:100%;accent-color:var(--accent)}
  .val{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  button.btn{
    padding:8px 10px; border:1px solid var(--line); background:#fff; border-radius:7px;
    cursor:pointer; font:12.5px inherit; color:var(--text);
  }
  button.btn:hover{border-color:#cfcfd4;background:#fafafa}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  button.btn.primary:hover{filter:brightness(1.06)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{flex:1;padding:7px 0;border:0;background:#fff;cursor:pointer;font:12px inherit;color:var(--text)}
  .seg button.on{background:var(--accent-soft);color:#1b4fc4;font-weight:600}
  .tips{font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
  input:disabled,button:disabled{opacity:.45;cursor:not-allowed}
  aside.no-sel .group:first-of-type::after{content:'';display:block}
  kbd{background:#f1f1f3;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<header>
  <b>Logo 拼装台</b>
  <span class="hint">拖动=移动 · Shift+拖动=旋转 · 滚轮=缩放 · 方向键=微调 · 点空白处或 Esc 取消选中</span>
</header>
<main>
  <div id="stage"><canvas id="cv" width="1024" height="1024"></canvas></div>
  <aside>
    <div class="group">
      <label class="t">选中图层</label>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="group">
      <label class="t">位置</label>
      <div class="row"><span class="k">X</span><input type="number" id="px" step="1"><span class="k">Y</span><input type="number" id="py" step="1"></div>
      <div class="row"><span class="k">缩放</span><input type="range" id="pscale" min="0.2" max="2" step="0.005"><span class="val" id="pscaleV">1.00</span></div>
      <div class="row"><span class="k">旋转</span><input type="range" id="prot" min="-180" max="180" step="0.5"><span class="val" id="protV">0°</span></div>
      <div class="grid2">
        <button class="btn" id="flip">水平翻转</button>
        <button class="btn" id="top">移到顶层</button>
      </div>
      <button class="btn" id="pick">用本地图片替换选中层</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="group">
      <label class="t">整图</label>
      <div class="row"><span class="k">圆角</span><input type="range" id="radius" min="0" max="512" step="1" value="100"><span class="val" id="radiusV">100</span></div>
      <div class="seg" id="bgseg">
        <button data-bg="paper" class="on">纸底</button>
        <button data-bg="none">透明</button>
      </div>
      <div class="grid2">
        <button class="btn" id="ghost">参考底图</button>
        <button class="btn" id="snap">吸附15°</button>
      </div>
    </div>

    <div class="group">
      <label class="t">导出</label>
      <div class="grid2">
        <button class="btn primary" id="exp1024">导出 1024</button>
        <button class="btn" id="exp512">导出 512</button>
      </div>
      <button class="btn" id="reset">恢复原始构图</button>
    </div>

    <div class="tips">
      <kbd>Shift</kbd>+拖动 = 旋转&nbsp;&nbsp;<kbd>Alt</kbd>+拖动 = 缩放<br>
      方向键微调 1px，按住 <kbd>Shift</kbd> 为 10px<br>
      可把图片直接拖进画布，替换选中层<br>导出的 PNG 已按圆角裁好，可直接当应用图标用
    </div>
  </aside>
</main>

const PAPER = '#f3ead3';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1024, H = 1024;

const state = {
  pieces: PARTS.map(p => ({
    ...p, img: null, cx: p.x + p.w / 2, cy: p.y + p.h / 2,
    scale: 1, rot: 0, flip: 1,
    home: { cx: p.x + p.w / 2, cy: p.y + p.h / 2, scale: 1, rot: 0, flip: 1 }
  })),
  sel: -1, radius: 100, bg: 'paper', ghost: false, snap: false
};

// ---- 载入图片 ----
let ready = 0;
state.pieces.forEach(p => {
  const im = new Image();
  im.onload = () => { p.img = im; if (++ready === state.pieces.length) draw(); };
  im.src = p.src;
});

// ---- 绘制 ----
function drawPiece(g, p, k = 1) {
  if (!p.img) return;
  g.save();
  g.translate(p.cx * k, p.cy * k);
  g.rotate(p.rot * Math.PI / 180);
  g.scale(p.scale * p.flip * k, p.scale * k);
  g.drawImage(p.img, -p.w / 2, -p.h / 2, p.w, p.h);
  g.restore();
}

function drawSelection() {
  if (state.sel < 0) return;
  const p = state.pieces[state.sel];
  ctx.save();
  ctx.translate(p.cx, p.cy);
  ctx.rotate(p.rot * Math.PI / 180);
  ctx.scale(p.scale * p.flip, p.scale);
  ctx.lineWidth = 2 / p.scale;
  ctx.setLineDash([8 / p.scale, 6 / p.scale]);
  ctx.strokeStyle = 'rgba(47,111,237,.85)';
  ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // 棋盘格表示透明
  if (state.bg === 'none') {
    const s = 32;
    for (let y = 0; y < H; y += s) for (let x = 0; x < W; x += s) {
      ctx.fillStyle = ((x / s + y / s) % 2 === 0) ? '#ffffff' : '#ececef';
      ctx.fillRect(x, y, s, s);
    }
  } else {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
  }
  if (state.ghost && state.ghostImg) {
    ctx.globalAlpha = 0.22;
    ctx.drawImage(state.ghostImg, 0, 0);
    ctx.globalAlpha = 1;
  }
  state.pieces.forEach(p => drawPiece(ctx, p));
  drawSelection();
}

// ---- 交互 ----
let drag = null;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function localOf(p, pt) {
  const dx = pt.x - p.cx, dy = pt.y - p.cy;
  const a = -p.rot * Math.PI / 180;
  const rx = dx * Math.cos(a) - dy * Math.sin(a);
  const ry = dx * Math.sin(a) + dy * Math.cos(a);
  return { x: rx / (p.scale * p.flip), y: ry / p.scale };
}
function hit(pt) {
  for (let i = state.pieces.length - 1; i >= 0; i--) {
    const p = state.pieces[i], l = localOf(p, pt);
    if (Math.abs(l.x) <= p.w / 2 && Math.abs(l.y) <= p.h / 2) return i;
  }
  return -1;
}

cv.addEventListener('pointerdown', e => {
  const pt = toCanvas(e);
  const i = hit(pt);
  if (i < 0) {                       // 点到空白处：取消选中，虚线框消失
    if (state.sel !== -1) { state.sel = -1; syncPanel(); draw(); }
    return;
  }
  state.sel = i; syncPanel(); draw();
  const p = state.pieces[i];
  drag = {
    mode: e.shiftKey ? 'rot' : (e.altKey ? 'scale' : 'move'),
    start: pt, cx0: p.cx, cy0: p.cy, rot0: p.rot, sc0: p.scale,
    a0: Math.atan2(pt.y - p.cy, pt.x - p.cx)
  };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  cv.classList.add('dragging');
});

cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const pt = toCanvas(e), p = state.pieces[state.sel];
  if (drag.mode === 'move') {
    p.cx = drag.cx0 + (pt.x - drag.start.x);
    p.cy = drag.cy0 + (pt.y - drag.start.y);
  } else if (drag.mode === 'rot') {
    const a = Math.atan2(pt.y - p.cy, pt.x - p.cx);
    let deg = drag.rot0 + (a - drag.a0) * 180 / Math.PI;
    if (state.snap) deg = Math.round(deg / 15) * 15;
    p.rot = ((deg + 180) % 360 + 360) % 360 - 180;
  } else {
    const d0 = Math.hypot(drag.start.x - p.cx, drag.start.y - p.cy) || 1;
    const d1 = Math.hypot(pt.x - p.cx, pt.y - p.cy);
    p.scale = Math.min(2, Math.max(0.2, drag.sc0 * d1 / d0));
  }
  syncPanel(); draw();
});

['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => {
  drag = null; cv.classList.remove('dragging');
}));

cv.addEventListener('wheel', e => {
  const pt = toCanvas(e);
  const i = hit(pt); if (i < 0) return;   // 滚轮只对指针下的图层生效
  e.preventDefault();
  state.sel = i;
  const p = state.pieces[i];
  p.scale = Math.min(2, Math.max(0.2, p.scale * (e.deltaY < 0 ? 1.04 : 0.96)));
  syncPanel(); draw();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.sel !== -1) { state.sel = -1; syncPanel(); draw(); }
    return;
  }
  if (state.sel < 0) return;
  const p = state.pieces[state.sel];
  const step = e.shiftKey ? 10 : 1;
  const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (map[e.key]) { e.preventDefault(); p.cx += map[e.key][0]; p.cy += map[e.key][1]; syncPanel(); draw(); }
  if (e.key === 'q' || e.key === 'Q') { p.rot -= e.shiftKey ? 15 : 1; syncPanel(); draw(); }
  if (e.key === 'e' || e.key === 'E') { p.rot += e.shiftKey ? 15 : 1; syncPanel(); draw(); }
});

// ---- 面板 ----
const tabs = document.getElementById('tabs');
state.pieces.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = p.label;
  b.onclick = () => { state.sel = i; syncPanel(); draw(); };
  tabs.appendChild(b);
});
const px = document.getElementById('px'), py = document.getElementById('py');
const pscale = document.getElementById('pscale'), pscaleV = document.getElementById('pscaleV');
const prot = document.getElementById('prot'), protV = document.getElementById('protV');

const panelInputs = [px, py, pscale, prot];
function syncPanel() {
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === state.sel));
  const none = state.sel < 0;
  panelInputs.forEach(el => { el.disabled = none; });
  ['flip', 'top', 'pick'].forEach(id => { document.getElementById(id).disabled = none; });
  document.querySelector('aside').classList.toggle('no-sel', none);
  if (none) {
    px.value = ''; py.value = ''; pscale.value = 1; pscaleV.textContent = '—';
    prot.value = 0; protV.textContent = '—';
    return;
  }
  const p = state.pieces[state.sel];
  px.value = Math.round(p.cx - p.w / 2);
  py.value = Math.round(p.cy - p.h / 2);
  pscale.value = p.scale; pscaleV.textContent = p.scale.toFixed(2);
  prot.value = p.rot; protV.textContent = Math.round(p.rot) + '°';
}
px.oninput = () => { if (state.sel < 0) return; const p = state.pieces[state.sel]; p.cx = (+px.value || 0) + p.w / 2; draw(); };
py.oninput = () => { if (state.sel < 0) return; const p = state.pieces[state.sel]; p.cy = (+py.value || 0) + p.h / 2; draw(); };
pscale.oninput = () => { if (state.sel < 0) return; state.pieces[state.sel].scale = +pscale.value; syncPanel(); draw(); };
prot.oninput = () => { if (state.sel < 0) return; state.pieces[state.sel].rot = +prot.value; syncPanel(); draw(); };
document.getElementById('flip').onclick = () => { if (state.sel < 0) return; const p = state.pieces[state.sel]; p.flip *= -1; draw(); };

// 用本地图片替换当前选中层
function replaceLayer(file) {
  if (state.sel < 0) return;
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const p = state.pieces[state.sel];
    p.img = im;
    // 等比缩放到原来的视觉大小（长边不超过画布的 78%）
    const k = Math.min(p.w * 1.0 / im.width, p.h * 1.0 / im.height, 780 / Math.max(im.width, im.height));
    p.w = Math.round(im.width * k);
    p.h = Math.round(im.height * k);
    p.scale = 1; p.rot = 0; p.flip = 1;
    p.cx = W / 2; p.cy = H / 2;
    URL.revokeObjectURL(url);
    syncPanel(); draw();
  };
  im.src = url;
}
document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => { replaceLayer(e.target.files[0]); e.target.value = ''; };
cv.addEventListener('dragover', e => { e.preventDefault(); });
cv.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) replaceLayer(f);
});
document.getElementById('top').onclick = () => {
  if (state.sel < 0) return;
  const [p] = state.pieces.splice(state.sel, 1);
  state.pieces.push(p); state.sel = state.pieces.length - 1; syncPanel(); draw();
};

const radius = document.getElementById('radius'), radiusV = document.getElementById('radiusV');
radius.oninput = () => { state.radius = +radius.value; radiusV.textContent = state.radius; };
document.querySelectorAll('#bgseg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#bgseg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); state.bg = b.dataset.bg; draw();
});
document.getElementById('ghost').onclick = e => {
  state.ghost = !state.ghost;
  e.currentTarget.classList.toggle('primary', state.ghost);
  if (state.ghost && !state.ghostImg) {
    const g = new Image();
    g.onload = () => { state.ghostImg = g; draw(); };
    g.src = GHOST_SRC;
  }
  draw();
};
document.getElementById('snap').onclick = e => {
  state.snap = !state.snap;
  e.currentTarget.classList.toggle('primary', state.snap);
};
document.getElementById('reset').onclick = () => {
  state.pieces.forEach(p => { p.cx = p.home.cx; p.cy = p.home.cy; p.scale = p.home.scale; p.rot = p.home.rot; p.flip = p.home.flip; });
  syncPanel(); draw();
};

// ---- 导出 ----
function exportPNG(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const k = size / W;
  const r = Math.min(state.radius * k, size / 2);
  g.save();
  g.beginPath();
  if (g.roundRect) g.roundRect(0, 0, size, size, r);
  else g.rect(0, 0, size, size);
  g.clip();
  if (state.bg !== 'none') { g.fillStyle = PAPER; g.fillRect(0, 0, size, size); }
  state.pieces.forEach(p => drawPiece(g, p, k));
  g.restore();
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `xtoolkit-logo-${size}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}
document.getElementById('exp1024').onclick = () => exportPNG(1024);
document.getElementById('exp512').onclick = () => exportPNG(512);
